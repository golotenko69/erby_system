name: Deploy Django to Beget

on:
  push:
    branches:
      - main  # или master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checks and tests
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: 'True'
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files via RSYNC
        uses: easingthemes/ssh-deploy-action@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.BEGET_HOST }}
          REMOTE_USER: ${{ secrets.BEGET_USER }}
          REMOTE_PORT: ${{ secrets.BEGET_PORT }}
          ARGS: "-rlcvz --delete"
          SOURCE: "."
          TARGET: "/home/z/zabteh/erbu.zabteh.ru/public_html"
          # media/ и staticfiles/ есть только на сервере — без исключения rsync --delete их сотрёт
          EXCLUDE: "/venv/, /.git/, /.github/, /.idea/, /db.sqlite3, /.env, /tmp/, /media/, /staticfiles/"

      - name: Post-deploy commands (Migrate, Static, Restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: ${{ secrets.BEGET_USER }}
          key: ${{ secrets.BEGET_SSH_KEY }}
          port: ${{ secrets.BEGET_PORT }}
          script: |
            # Подключение к Docker-окружению Beget и выполнение команд
            ssh localhost -p222 << 'EOF'
              cd /home/z/zabteh/erbu.zabteh.ru/public_html
              source venv/bin/activate
              pip install -r requirements.txt
              # --fake-initial: таблицы на сервере уже есть, а начальные миграции впервые попали в репозиторий
              python manage.py migrate --noinput --fake-initial
              python manage.py collectstatic --noinput
              mkdir -p tmp
              touch tmp/restart.txt
            EOF