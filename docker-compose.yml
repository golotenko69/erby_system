services:
  # 1. Сервис Django
  web:
    build: .
    container_name: django_web_app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn django_erbu.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    dns:
      - 8.8.8.8
    volumes:
      - .:/app
      # Собранная статика (STATIC_ROOT) — общая с Nginx
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    restart: unless-stopped

  # 2. Сервис Веб-сервера Nginx
  nginx:
    image: nginx:1.27
    container_name: django_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_volume: # Собранная статика, общая для Django и Nginx
  media_volume:  # Общая папка для медиа-файлов
